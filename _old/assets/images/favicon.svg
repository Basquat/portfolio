<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffff00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="16" fill="#0a0a0f"/>

  <!-- Border glow -->
  <rect x="2" y="2" width="96" height="96" rx="14" fill="none" stroke="url(#cyberGradient)" stroke-width="2" filter="url(#glow)"/>

  <!-- Circuit pattern -->
  <g stroke="url(#cyberGradient)" stroke-width="1.5" fill="none" filter="url(#glow)">
    <path d="M20 30 L50 30 L50 50 L80 50"/>
    <path d="M30 20 L30 50 L50 50 L50 80"/>
    <circle cx="50" cy="50" r="12" stroke-width="2"/>
    <circle cx="50" cy="50" r="6" fill="url(#cyberGradient)"/>
  </g>

  <!-- Corner accents -->
  <g stroke="#00ffff" stroke-width="2" fill="none">
    <path d="M16 16 L16 28 M16 16 L28 16"/>
    <path d="M84 16 L72 16 M84 16 L84 28"/>
    <path d="M16 84 L16 72 M16 84 L28 84"/>
    <path d="M84 84 L72 84 M84 84 L84 72"/>
  </g>

  <!-- Text "PF" -->
  <text x="50" y="58" font-family="Rajdhani, Orbitron, sans-serif" font-size="24" font-weight="700" fill="url(#cyberGradient)" text-anchor="middle" filter="url(#glow)">PF</text>
</svg>